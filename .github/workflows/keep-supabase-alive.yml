name: Keep Supabase Alive

on:
  schedule:
    # Runs every 4 days at 04:00 UTC to prevent free-tier project pausing
    - cron: '0 4 */4 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning ::SUPABASE_URL or SUPABASE_ANON_KEY secret is not set. Please set them in Repository Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          echo "Pinging Supabase at $SUPABASE_URL..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/students?select=id&limit=1")
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Successfully pinged Supabase. Project kept active!"
          else
            echo "::notice ::Ping returned status $HTTP_STATUS. Please verify credentials or project status."
          fi
